<div class="shipment-container">
  <div class="form-section">
    <h2>Shipment Tracking Form</h2>

    <form [formGroup]="shipmentForm" (ngSubmit)="onSubmit()">
      <!-- Shipment ID Field -->
      <div class="form-group">
        <label for="shipmentId">Shipment ID <span class="required">*</span></label>
        <input
          type="text"
          id="shipmentId"
          class="form-control"
          formControlName="shipmentId"
          placeholder="Enter shipment ID"
          required
        />
        <div class="error-message" *ngIf="shipmentForm.get('shipmentId')?.invalid && shipmentForm.get('shipmentId')?.touched">
          Shipment ID is required
        </div>
      </div>

      <!-- Shipment Type Radio Buttons -->
      <div class="form-group">
        <label>Shipment Type <span class="required">*</span></label>
        <div class="radio-group">
          <div class="radio-option" *ngFor="let type of shipmentTypes">
            <input
              type="radio"
              [id]="type.value"
              [value]="type.value"
              formControlName="shipmentType"
              required
            />
            <label [for]="type.value">{{ type.label }}</label>
          </div>
        </div>
        <div class="error-message" *ngIf="shipmentForm.get('shipmentType')?.invalid && shipmentForm.get('shipmentType')?.touched">
          Shipment Type is required
        </div>
      </div>

      <!-- Attributes Checkboxes -->
      <div class="form-group">
        <label>Attributes</label>
        <div class="checkbox-group">
          <div class="checkbox-option" *ngFor="let attr of attributes">
            <input
              type="checkbox"
              [id]="attr"
              [formControlName]="attr"
            />
            <label [for]="attr">{{ attr }}</label>
          </div>
        </div>
      </div>

      <!-- Comments Textarea -->
      <div class="form-group">
        <label for="comments">Comments</label>
        <textarea
          id="comments"
          class="form-control textarea"
          formControlName="comments"
          placeholder="Enter any additional comments"
          rows="4"
        ></textarea>
      </div>

      <!-- Action Buttons -->
      <div class="button-group">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="shipmentForm.invalid || isLoading()"
        >
          {{ isLoading() ? 'Submitting...' : 'Submit' }}
        </button>
        <button
          type="button"
          class="btn btn-secondary"
          (click)="resetForm()"
        >
          Reset
        </button>
      </div>
    </form>

    <!-- Error Message Display -->
    <div class="error-alert" *ngIf="errorMessage()">
      <strong>Error:</strong> {{ errorMessage() }}
    </div>
  </div>

  <!-- Results Table Section -->
  <div class="results-section" *ngIf="shipmentResults()">
    <h2>Shipment Tracking Results</h2>
    <table class="results-table">
      <thead>
        <tr>
          <th>Shipment ID</th>
          <th>Origin</th>
          <th>Destination</th>
          <th>Track Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let result of shipmentResults()">
          <td>{{ result.shipmentId }}</td>
          <td>{{ result.origin }}</td>
          <td>{{ result.destination }}</td>
          <td>{{ result.trackStatus }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
